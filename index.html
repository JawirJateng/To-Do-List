<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                </div>
                <h2>To-Do List</h2>
                <button class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="Tutup Menu">&times;</button>
            </div>
            
            <nav class="sidebar-nav">
                <a href="#dashboard" class="nav-item active" data-view="dashboard">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    Dashboard
                </a>
                <a href="#tasks" class="nav-item" data-view="tasks">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                    Semua Tugas
                </a>
                
                <div class="nav-section-title">Kategori</div>
                <div id="sidebarCategoryList" class="sidebar-sub-nav-container">
                    <!-- Populated dynamically -->
                </div>
            </nav>

            <div class="sidebar-footer">
                <p>To-Do List v1.0</p>
            </div>
        </aside>

        <!-- Main Content Wrapper -->
        <main class="main-content">
            <!-- Top Header -->
            <header class="top-header">
                <button class="menu-toggle-btn" id="menuToggleBtn" aria-label="Buka Menu">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <div class="header-title" id="headerTitle">Dashboard</div>
                <div class="header-actions">
                    <button class="btn btn-primary" id="openAddTaskModal">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        <span>Tambah Tugas</span>
                    </button>
                </div>
            </header>

            <!-- Dynamic View Container -->
            <div class="content-body" id="contentBody">
                <!-- Views will be dynamically rendered here -->
            </div>
        </main>
    </div>

    <!-- Task Form Modal (Add / Edit) -->
    <div class="modal-overlay" id="taskModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modalTitle">Tambah Tugas Baru</h3>
                <button class="modal-close-btn" id="closeTaskModal">&times;</button>
            </div>
            <form id="taskForm">
                <input type="hidden" id="taskId">
                <div class="form-group">
                    <label for="taskTitle">Judul Tugas <span class="required">*</span></label>
                    <input type="text" id="taskTitle" required maxlength="255" placeholder="Contoh: Mengerjakan laporan praktikum">
                </div>

                <div class="form-group">
                    <label for="taskDescription">Deskripsi</label>
                    <textarea id="taskDescription" rows="3" placeholder="Tambahkan detail atau catatan tugas (opsional)"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskCategory">Kategori <span class="required">*</span></label>
                        <input type="text" id="taskCategory" list="categorySuggestions" required placeholder="Pilih atau ketik kategori baru...">
                        <datalist id="categorySuggestions">
                            <option value="Kuliah">
                            <option value="Pekerjaan">
                            <option value="Personal">
                        </datalist>
                    </div>

                    <div class="form-group">
                        <label for="taskPriority">Prioritas <span class="required">*</span></label>
                        <select id="taskPriority" required>
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskDueDate">Deadline</label>
                        <input type="date" id="taskDueDate">
                    </div>

                    <div class="form-group" id="statusGroup" style="display: none;">
                        <label for="taskStatus">Status</label>
                        <select id="taskStatus">
                            <option value="Pending">Pending</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancelTaskModal">Batal</button>
                    <button type="submit" class="btn btn-primary" id="saveTaskBtn">Simpan Tugas</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Task Detail Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3>Detail Tugas</h3>
                <button class="modal-close-btn" id="closeDetailModal">&times;</button>
            </div>
            <div class="modal-body" id="detailModalBody">
                <!-- Populated dynamically -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger" id="detailDeleteBtn">Hapus</button>
                <button type="button" class="btn btn-primary" id="detailEditBtn">Edit</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal-container modal-sm">
            <div class="modal-header">
                <h3>Konfirmasi Hapus</h3>
                <button class="modal-close-btn" id="closeDeleteModal">&times;</button>
            </div>
            <div class="modal-body">
                <p>Apakah Anda yakin ingin menghapus tugas <strong id="deleteTaskTitle"></strong>? Tindakan ini tidak dapat dibatalkan.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancelDeleteBtn">Batal</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Ya, Hapus</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <!-- Scripts -->
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/tasks.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
